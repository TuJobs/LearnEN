<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Học tiếng Anh chuyên ngành CNTT cho lập trình viên Việt Nam: spaced repetition, học trong ngữ cảnh code và mini-game." />
    <meta name="theme-color" content="#161b22" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>LearnEN — Tiếng Anh cho Dev</title>
    <script>
      // Apply the saved (or OS) theme before first paint to avoid a flash of the wrong theme.
      try {
        const t = JSON.parse(localStorage.getItem('learnen:progress:v1') || '{}').settings?.theme || 'system'
        const dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
